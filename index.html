<!DOCTYPE html>
<html>
<head>
    <title>UPI Fraud Detection</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }

        .card {
            background: white;
            padding: 30px;
            width: 350px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 10px;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 10px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #4338ca;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>UPI Fraud Detection</h2>

        <form action="/predict" method="POST">
            <label>Amount</label>
            <input type="number" name="amount" required>

            <label>Previous Frauds</label>
            <input type="number" name="prev_frauds" required>

            <label>Hour of Transaction (0–23)</label>
            <input type="number" name="hour" min="0" max="23" required>

            <button type="submit">Check Fraud</button>
        </form>
    </div>

</body>
</html>
